[project]
name = "code-cards"
version = "0.1.0"
description = "Flash cards de terminal para praticar leitura de código com repetição espaçada (FSRS)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diogo Vieira" }]
requires-python = ">=3.11"
dependencies = [
    "textual[syntax]>=3.0",
    "fsrs>=6.0,<7",
    "typer>=0.15",
    "platformdirs>=4.0",
    "filelock>=3.12",
]

[project.scripts]
code-cards = "code_cards.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_cards"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# BINDINGS/CSS do Textual são atributos de classe por design.
"src/code_cards/tui/**" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
packages = ["code_cards"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
